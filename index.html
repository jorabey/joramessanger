<!DOCTYPE html>
<html lang="uz" class="dark bg-black text-white" translate="no">
  <head>
    <meta charset="UTF-8" />
    <title>Jora Messenger</title>

    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="yandex" content="none">
    <meta name="bingbot" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jora">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Jora">
    <meta name="theme-color" content="#000000">

    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">

    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        /* Pull-to-refresh (tepaga tortganda yangilanish) funksiyasini butunlay o'ldiradi */
        overscroll-behavior: none; 
        /* Matnlarni belgilash va nusxalashni bloklaydi */
        -webkit-user-select: none; 
        user-select: none;
        /* Rasm/URL larni uzoq bosganda chiqadigan tizim menyusini yo'q qiladi */
        -webkit-touch-callout: none; 
        /* Ekranga tekkanda chiqadigan ko'k/kulrang xiralikni tozalaydi */
        -webkit-tap-highlight-color: transparent; 
        position: fixed;
        overflow: hidden;
      }
      /* Faqat klaviatura chiqishi kerak bo'lgan joylarda matn belgilashga ruxsat */
      input, textarea {
        -webkit-user-select: auto;
        user-select: auto;
      }
    </style>
  </head>
  
  <body>
    <div id="root" class="w-full h-full relative overflow-hidden"></div>
    <script>window.global = window;</script>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
