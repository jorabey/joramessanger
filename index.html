<!DOCTYPE html>
<html lang="uz" class="dark bg-black text-white" translate="no">
  <head>
    <meta charset="UTF-8" />
    <title>Jora Messenger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        overscroll-behavior: none;
        -webkit-user-select: none; 
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; 
        /* 🔴 position: fixed va overflow: hidden olib tashlandi (iOS qotmasligi uchun) */
      }
      input, textarea {
        -webkit-user-select: auto;
        user-select: auto;
      }
    </style>
    
    <script>
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT' || (e.message && e.message.includes('dynamically imported module'))) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for(let reg of regs) reg.unregister();
              window.location.reload(true);
            });
          }
        }
      }, true);
    </script>
  </head>
  
  <body>
    <div id="root" class="w-full h-full relative"></div>
    <script>window.global = window;</script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
