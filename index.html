<!DOCTYPE html>
<html lang="uz" translate="no">
  <head>
    <meta charset="UTF-8" />
    <title>Jora Messenger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6809191271664656"
     crossorigin="anonymous"></script>
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <script>
      (function() {
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    
    <script>
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT' || (e.message && e.message.includes('dynamically imported module'))) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for(let reg of regs) reg.unregister();
              window.location.reload(true);
            });
          }
        }
      }, true);
    </script>
  </head>
  
  <body class="bg-white dark:bg-black text-black dark:text-white transition-colors duration-300">
    <div id="root" class="w-full h-full relative"></div>
    <script>window.global = window;</script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
